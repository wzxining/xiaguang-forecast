<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>霞时 · 手机预览</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { display: grid; place-items: center; background: #e8e6e1; }
    iframe { display: block; width: min(390px, 100%); height: min(844px, 100%); border: 0; background: #faf9f6; }
    @media (min-width: 450px) { iframe { outline: 1px solid #d9d6d0; border-radius: 16px; } }
  </style>
</head>
<body>
  <iframe src="./" title="霞时手机端" allow="geolocation; clipboard-write; web-share"></iframe>
</body>
</html>
